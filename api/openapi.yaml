openapi: 3.0.3
info:
  title: Crown Manufacturing API
  version: 0.1.0
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness and database check
      responses:
        "200":
          description: Service and database are healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Database unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/auth/login:
    post:
      operationId: login
      summary: Sign in with email and password; sets the session cookie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Wrong email or password (the same answer for both)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many failed attempts for this email; see the Retry-After header (seconds). Limits are the settings login_max_attempts and login_lockout_minutes
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/auth/logout:
    post:
      operationId: logout
      summary: End the session and clear the cookie
      responses:
        "204":
          description: Signed out
  /api/auth/me:
    get:
      operationId: getMe
      summary: The signed-in user with roles and permissions
      responses:
        "200":
          description: The current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/auth/preferences:
    patch:
      operationId: setPreferences
      summary: Save your own language and calendar; only the fields sent change. Allowed even while a password change is pending
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Preferences"
      responses:
        "204":
          description: Saved
        "422":
          description: Unknown value (error invalid_preference)
  /api/auth/password:
    post:
      operationId: changeOwnPassword
      summary: Change your own password; your other sessions end
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Changed
        "403":
          description: Current password is wrong (error wrong_password)
        "422":
          description: New password too short (weak_password) or the same as the current one (password_unchanged)
  /api/roles:
    get:
      operationId: listRoles
      summary: Roles and their permissions (needs users.manage)
      responses:
        "200":
          description: Roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoleInfo"
  /api/users:
    get:
      operationId: listUsers
      summary: All users (needs users.manage)
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserSummary"
    post:
      operationId: createUser
      summary: Create a user (needs users.manage)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "409":
          description: Email already in use (error email_taken)
        "422":
          description: Invalid email, weak password or unknown role
  /api/users/{id}:
    patch:
      operationId: updateUser
      summary: Change name, active flag and roles; only the fields sent change (needs users.manage)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "204":
          description: Updated; deactivating ends the user's sessions
        "404":
          description: Unknown user
        "409":
          description: Would leave no active user with users.manage (error last_admin)
        "422":
          description: Unknown role
  /api/users/{id}/password:
    post:
      operationId: resetUserPassword
      summary: Set a new password for a user and end their sessions (needs users.manage)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
      responses:
        "204":
          description: Reset
        "422":
          description: Password too short
  /api/materials:
    get:
      operationId: listMaterials
      summary: Raw materials and additives, with how many recipes in use contain each (needs masterdata.read)
      responses:
        "200":
          description: Materials
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Material"
    post:
      operationId: createMaterial
      summary: Add a raw material or additive (needs masterdata.manage)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaterialInput"
      responses:
        "201":
          description: Created
        "409":
          description: Name already used (duplicate_name)
        "422":
          description: invalid_input, invalid_quantity or unit_not_allowed
  /api/materials/{id}:
    patch:
      operationId: updateMaterial
      summary: Rename, change bag size, or retire a material (needs masterdata.manage). Kind and unit never change
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaterialInput"
      responses:
        "200":
          description: Updated
  /api/products:
    get:
      operationId: listProducts
      summary: Products with their colours and each colour's recipe in use (needs masterdata.read)
      responses:
        "200":
          description: Products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      summary: Add a product; its "regrind from this product" item is created automatically (needs masterdata.manage)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Created
        "409":
          description: duplicate_name
        "422":
          description: invalid_input or invalid_quantity
  /api/products/{id}:
    patch:
      operationId: updateProduct
      summary: Change a product. The sale unit is locked once any recipe exists (409 unit_locked)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "200":
          description: Updated
        "409":
          description: duplicate_name or unit_locked
  /api/products/{id}/colours:
    post:
      operationId: createColour
      summary: Add a colour; its finished-goods item is created automatically (needs masterdata.manage)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ColourInput"
      responses:
        "201":
          description: Created
  /api/colours/{id}:
    patch:
      operationId: updateColour
      summary: Rename or retire a colour (needs masterdata.manage)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ColourInput"
      responses:
        "200":
          description: Updated
  /api/colours/{id}/recipe:
    get:
      operationId: getRecipe
      summary: The recipe version in use for a colour (404 no_recipe when there is none)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The recipe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recipe"
  /api/colours/{id}/recipe/versions:
    get:
      operationId: listRecipeVersions
      summary: Every version, newest first, with who made it and why
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Versions
    post:
      operationId: saveRecipe
      summary: Save the next version and make it the one in use. Earlier versions are kept unchanged
      description: base_version is the version the editor started from (0 for a first recipe). If someone saved first the answer is 409 version_conflict and nothing changes. Other refusals are 422 with one of reason_required, no_ingredients, duplicate_ingredient, invalid_quantity, unit_not_allowed, unknown_item, invalid_blend, duplicate_regrind_source, unknown_regrind_source, invalid_tolerance.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewRecipe"
      responses:
        "201":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recipe"
        "409":
          description: version_conflict
  /api/colours/{id}/recipe/versions/{n}:
    get:
      operationId: getRecipeVersion
      summary: One version, active or replaced
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: n
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The recipe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recipe"
  /api/workspaces:
    get:
      operationId: listWorkspaces
      summary: Machines and areas, each with the moulds on it (needs masterdata.read)
      responses:
        "200":
          description: Workspaces
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Workspace"
    post:
      operationId: createWorkspace
      summary: Add one (needs masterdata.manage)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceInput"
      responses:
        "201":
          description: Created
        "409":
          description: duplicate_name
        "422":
          description: invalid_input
  /api/workspaces/{id}:
    patch:
      operationId: updateWorkspace
      summary: Rename, change kind or 24-hour running, or retire (needs masterdata.manage)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceInput"
      responses:
        "200":
          description: Updated
  /api/workspaces/{id}/moulds/{mould}:
    put:
      operationId: setMould
      summary: Put a mould on a machine or change it (standard cycle time, cycle times per colour); active false takes it off (needs masterdata.manage)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: mould, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupInput"
      responses:
        "200":
          description: The machine with its moulds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "422":
          description: not_a_machine, invalid_cycle_time, unknown_colour
  /api/moulds:
    get:
      operationId: listMoulds
      summary: Moulds, each making one product (needs masterdata.read)
      responses:
        "200":
          description: Moulds
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Mould"
    post:
      operationId: createMould
      summary: Add one (needs masterdata.manage)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MouldInput"
      responses:
        "201":
          description: Created
        "409":
          description: duplicate_name
        "422":
          description: invalid_input, invalid_cavities, unknown_product
  /api/moulds/{id}:
    patch:
      operationId: updateMould
      summary: Rename, change cavities, or retire; the product never changes (needs masterdata.manage)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MouldInput"
      responses:
        "200":
          description: Updated
  /api/shifts:
    get:
      operationId: listShifts
      summary: Shift definitions in local time (needs masterdata.read)
      responses:
        "200":
          description: Shifts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Shift"
    post:
      operationId: createShift
      summary: Add one (needs masterdata.manage)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShiftInput"
      responses:
        "201":
          description: Created
        "409":
          description: duplicate_name
        "422":
          description: invalid_input, invalid_time
  /api/shifts/{id}:
    patch:
      operationId: updateShift
      summary: Change a shift; new start or end times need a reason (reason_required), written to the audit log (needs masterdata.manage)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShiftInput"
      responses:
        "200":
          description: Updated
  /api/reasons:
    get:
      operationId: listReasons
      summary: Damage and downtime reasons (needs masterdata.read)
      responses:
        "200":
          description: Reasons
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reason"
    post:
      operationId: createReason
      summary: Add one (needs masterdata.manage)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonInput"
      responses:
        "201":
          description: Created
        "409":
          description: duplicate_name
        "422":
          description: invalid_input
  /api/reasons/{id}:
    patch:
      operationId: updateReason
      summary: Rename or retire; the kind never changes (needs masterdata.manage)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonInput"
      responses:
        "200":
          description: Updated
  /api/locations:
    get:
      operationId: listLocations
      summary: The five fixed stock places (needs masterdata.read)
      responses:
        "200":
          description: Locations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Location"
  /api/locations/{key}:
    patch:
      operationId: renameLocation
      summary: Rename a place; places cannot be added or removed (needs masterdata.manage)
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationInput"
      responses:
        "200":
          description: Renamed
  /api/professions:
    get:
      operationId: listProfessions
      summary: Job titles, with how many active employees hold each (needs masterdata.read)
      responses:
        "200":
          description: Professions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Profession"
    post:
      operationId: createProfession
      summary: Add one (needs masterdata.manage)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfessionInput"
      responses:
        "201":
          description: Created
        "409":
          description: duplicate_name
        "422":
          description: invalid_input
  /api/professions/{id}:
    patch:
      operationId: updateProfession
      summary: Rename or retire (needs masterdata.manage)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfessionInput"
      responses:
        "200":
          description: Updated
  /api/employees:
    get:
      operationId: listEmployees
      summary: Everyone who works at Crown; operators have no account (needs masterdata.read)
      responses:
        "200":
          description: Employees
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Employee"
    post:
      operationId: createEmployee
      summary: Add one (needs masterdata.manage)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeInput"
      responses:
        "201":
          description: Created
        "409":
          description: duplicate_name, account_linked
        "422":
          description: invalid_input, unknown_profession, unknown_user
  /api/employees/{id}:
    patch:
      operationId: updateEmployee
      summary: Change or retire an employee; user_id null removes the account link (needs masterdata.manage)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeInput"
      responses:
        "200":
          description: Updated
  /api/settings:
    get:
      operationId: getSettings
      summary: The settings the settings screen edits, with current values (needs settings.manage)
      responses:
        "200":
          description: Key to value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
    patch:
      operationId: updateSettings
      summary: Change several settings at once, all or none; each change is audited (needs settings.manage)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Settings"
      responses:
        "200":
          description: All settings after the change
        "422":
          description: "{error, key}: unknown_setting, invalid_value, invalid_time_zone, out_of_range, tolerance_order"
components:
  schemas:
    Health:
      type: object
      required: [status, database]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        database:
          type: string
          enum: [up, down]
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
    Role:
      type: object
      required: [key, name, name_am]
      properties:
        key:
          type: string
        name:
          type: string
        name_am:
          type: string
    User:
      type: object
      required: [id, email, full_name, must_change_password, roles, permissions]
      properties:
        id:
          type: string
        email:
          type: string
        full_name:
          type: string
        preferences:
          $ref: "#/components/schemas/Preferences"
        must_change_password:
          type: boolean
          description: When true the API refuses everything except /api/auth/me, /api/auth/password and logout, with 403 password_change_required, until the password is changed
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
        permissions:
          type: array
          items:
            type: string
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Stable code (for example invalid_credentials, unauthenticated, forbidden), translated by the frontend
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
        new_password:
          type: string
    CreateUserRequest:
      type: object
      required: [email, full_name, password, roles]
      properties:
        email:
          type: string
        full_name:
          type: string
        password:
          type: string
        roles:
          type: array
          items:
            type: string
    UpdateUserRequest:
      type: object
      properties:
        full_name:
          type: string
        active:
          type: boolean
        roles:
          type: array
          items:
            type: string
    UserSummary:
      type: object
      required: [id, email, full_name, active, must_change_password, roles]
      properties:
        id:
          type: string
        email:
          type: string
        full_name:
          type: string
        active:
          type: boolean
        must_change_password:
          type: boolean
        roles:
          type: array
          items:
            type: string
    RoleInfo:
      type: object
      required: [key, name, name_am, description, description_am, permissions]
      properties:
        key:
          type: string
        name:
          type: string
        name_am:
          type: string
        description:
          type: string
          description: One line, in English
        description_am:
          type: string
          description: One line, in Amharic (needs native-speaker review)
        permissions:
          type: array
          items:
            type: string
    Preferences:
      type: object
      description: A person's saved display choices. null means not chosen yet; the device value is then used.
      properties:
        language:
          type: string
          nullable: true
          enum: [en, am]
        calendar:
          type: string
          nullable: true
          enum: [ethiopian, gregorian]
    Material:
      type: object
      properties:
        id: { type: string }
        kind: { type: string, enum: [raw_material, additive] }
        name: { type: string }
        name_am: { type: string }
        unit: { type: string, enum: [kg, g] }
        bag_qty: { type: string, nullable: true }
        active: { type: boolean }
        used_in: { type: integer, description: Recipes in use that contain this material }
    MaterialInput:
      type: object
      properties:
        kind: { type: string, enum: [raw_material, additive] }
        name: { type: string }
        name_am: { type: string }
        unit: { type: string, enum: [kg, g] }
        bag_qty: { type: string, nullable: true }
        active: { type: boolean }
    Colour:
      type: object
      properties:
        id: { type: string }
        product_id: { type: string }
        name: { type: string }
        name_am: { type: string }
        active: { type: boolean }
        active_version: { type: integer, nullable: true, description: null when the colour has no recipe yet }
    ColourInput:
      type: object
      properties:
        name: { type: string }
        name_am: { type: string }
        active: { type: boolean }
    Product:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        name_am: { type: string }
        sale_unit: { type: string, enum: [piece, kg] }
        package_qty: { type: string }
        weight_per_piece_g: { type: string, nullable: true }
        active: { type: boolean }
        colours:
          type: array
          items:
            $ref: "#/components/schemas/Colour"
    ProductInput:
      type: object
      properties:
        name: { type: string }
        name_am: { type: string }
        sale_unit: { type: string, enum: [piece, kg] }
        package_qty: { type: string }
        weight_per_piece_g: { type: string, nullable: true }
        active: { type: boolean }
    Recipe:
      type: object
      description: Quantities are exact decimals as strings, per ONE sale unit of the product
      properties:
        colour_id: { type: string }
        version: { type: integer }
        status: { type: string, enum: [active, replaced] }
        reason: { type: string }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        replaced_at: { type: string, format: date-time, nullable: true }
