services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crown}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crown_dev}
      POSTGRES_DB: ${POSTGRES_DB:-crown}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crown}"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
